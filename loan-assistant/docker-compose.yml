services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: loandb
      MYSQL_USER: loanuser
      MYSQL_PASSWORD: loanpass
      MYSQL_ROOT_PASSWORD: rootpass
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uloanuser", "-ploanpass"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://db:3306/loandb
      DB_USERNAME: loanuser
      DB_PASSWORD: loanpass
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-5-20250929}
    ports:
      - "8080:8080"
    volumes:
      - uploads:/data/uploads

volumes:
  db-data:
  uploads:
