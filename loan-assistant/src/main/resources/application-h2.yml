spring:
  datasource:
    url: jdbc:h2:mem:loandb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      # Skip schema validation under H2: in MODE=MySQL, H2 parses LONGTEXT as
      # VARCHAR while Hibernate's H2 dialect expects CLOB for @Lob columns.
      # Flyway still creates the real schema; MySQL keeps strict validation.
      ddl-auto: none
