<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('Application detail')}"></head>
<body>
<div th:replace="~{fragments/common :: navbar}"></div>
<div class="container">
    <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="m-0">Application #<span th:text="${app.id}"></span></h3>
        <span class="badge fs-6"
              th:classappend="${app.status.name() == 'APPROVED'} ? 'text-bg-success'
                            : (${app.status.name() == 'REJECTED'} ? 'text-bg-danger'
                            : (${app.status.name() == 'PENDING_MANUAL_REVIEW'} ? 'text-bg-warning'
                            : 'text-bg-secondary'))"
              th:text="${app.status}"></span>
    </div>

    <div class="row">
        <div class="col-md-6">
            <div class="card mb-3">
                <div class="card-header">Application</div>
                <table class="table table-sm mb-0">
                    <tr><th>Applicant</th><td th:text="${app.applicantName}"></td></tr>
                    <tr><th>Email</th><td th:text="${app.applicantEmail}"></td></tr>
                    <tr><th>Annual income</th><td th:text="${app.annualIncome}"></td></tr>
                    <tr><th>Monthly debt payments</th><td th:text="${app.monthlyDebtPayments}"></td></tr>
                    <tr><th>Credit score</th><td th:text="${app.creditScore}"></td></tr>
                    <tr><th>Employment</th>
                        <td th:text="${app.employmentStatus} + (${app.monthsEmployed} + ' mo'
                                + (${app.employerName} != null ? ', ' + ${app.employerName} : ''))"></td></tr>
                    <tr><th>Loan amount</th><td th:text="${app.loanAmount}"></td></tr>
                    <tr><th>Term</th><td th:text="${app.termMonths + ' months'}"></td></tr>
                    <tr><th>Purpose</th><td th:text="${app.loanPurpose}"></td></tr>
                    <tr><th>Submitted</th>
                        <td th:text="${#temporals.format(app.createdAt, 'yyyy-MM-dd HH:mm')}"></td></tr>
                </table>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card mb-3" th:if="${!#lists.isEmpty(app.decisions)}">
                <div class="card-header">Decision</div>
                <div class="card-body" th:with="latest=${app.decisions.get(app.decisions.size()-1)}">
                    <p><strong th:text="${latest.decision}"></strong>
                        <span class="text-muted" th:text="'(' + ${latest.source} + ')'"></span></p>
                    <p style="white-space: pre-line" th:text="${latest.customerExplanation}"></p>
                </div>
            </div>
            <div class="card mb-3" th:if="${app.status.name() == 'PENDING_MANUAL_REVIEW'}">
                <div class="card-body">
                    Your application is being reviewed by a loan officer.
                    You will be notified when a decision is made.
                </div>
            </div>
            <div class="card mb-3">
                <div class="card-header">Documents</div>
                <div class="list-group list-group-flush">
                    <div class="list-group-item text-muted" th:if="${#lists.isEmpty(app.documents)}">
                        No documents uploaded.
                    </div>
                    <a class="list-group-item list-group-item-action d-flex justify-content-between"
                       th:each="doc : ${app.documents}"
                       th:href="@{/applications/{aid}/documents/{did}(aid=${app.id}, did=${doc.id})}">
                        <span th:text="${doc.originalFilename}"></span>
                        <small class="text-muted" th:text="${doc.sizeBytes} + ' B'"></small>
                    </a>
                </div>
            </div>
        </div>
    </div>
    <a class="btn btn-outline-secondary" th:href="@{/applications}">Back</a>
</div>
</body>
</html>
