<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title}">Loan Assistant</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">Loan Assistant</a>
        <div class="d-flex align-items-center" sec:authorize="isAuthenticated()">
            <a class="btn btn-outline-light btn-sm me-2" th:href="@{/applications}"
               sec:authorize="hasRole('CUSTOMER')">My Applications</a>
            <a class="btn btn-outline-light btn-sm me-2" th:href="@{/officer/queue}"
               sec:authorize="hasAnyRole('OFFICER','ADMIN')">Review Queue</a>
            <span class="navbar-text me-3" sec:authentication="name">user</span>
            <form th:action="@{/logout}" method="post" class="m-0">
                <button class="btn btn-warning btn-sm" type="submit">Logout</button>
            </form>
        </div>
    </div>
</nav>
</body>
</html>
